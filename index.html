<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#8B0000;
  --accent-light:rgba(139,0,0,0.8);
  --bg:#FDFAF7;
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-script:'Great Vibes',cursive;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);
}
html{scroll-behavior:smooth}
body{font-family:var(--font-serif);background:#fff;color:var(--accent);-webkit-font-smoothing:antialiased}

/* Noise texture overlay */
.section-bg::before{
  content:'';position:absolute;inset:0;z-index:0;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}

/* Section base */
.event-section{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4rem 2rem;position:relative;overflow:hidden;background:var(--bg);
}
.event-section .content{max-width:540px;width:100%;text-align:center;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.8rem}

/* Section divider */
.section-divider{width:100%;height:1px;background:var(--accent);opacity:0.3}

/* Typography */
.host-name{font-family:var(--font-serif);font-weight:600;font-size:clamp(1.1rem,3vw,1.6rem);letter-spacing:0.15em;text-transform:uppercase;color:var(--accent)}
.invite-line{font-family:var(--font-serif);font-weight:400;font-size:clamp(0.7rem,2vw,1rem);letter-spacing:0.2em;text-transform:uppercase;color:var(--accent-light)}
.couple-name{font-family:var(--font-script);font-size:clamp(2rem,7vw,3.5rem);font-weight:400;color:var(--accent);line-height:1.2}
.with-text{font-family:var(--font-serif);font-size:clamp(0.65rem,1.8vw,0.85rem);letter-spacing:0.3em;text-transform:uppercase;color:var(--accent-light)}
.phrase{font-family:var(--font-serif);font-weight:300;font-size:clamp(0.75rem,2vw,1rem);letter-spacing:0.35em;text-transform:uppercase;color:var(--accent-light)}

/* Date block */
.date-block{display:flex;align-items:center;justify-content:center;gap:0;width:100%}
.date-left,.date-right{flex:1;max-width:140px}
.date-left{text-align:right;padding-right:1.2rem}
.date-right{text-align:left;padding-left:1.2rem}
.date-center{position:relative;padding:0 1.2rem;display:flex;align-items:center;justify-content:center}
.date-center::before,.date-center::after{content:'';position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:0.4}
.date-center::before{left:0}
.date-center::after{right:0}
.date-number{font-family:var(--font-serif);font-weight:300;font-size:clamp(4rem,15vw,7rem);line-height:1;color:var(--accent)}
.date-label{font-family:var(--font-serif);font-weight:400;font-size:clamp(0.7rem,1.8vw,0.9rem);letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.date-label.underlined{text-decoration:underline;text-underline-offset:3px}
.date-value{font-family:var(--font-serif);font-weight:400;font-size:clamp(0.7rem,1.8vw,0.9rem);letter-spacing:0.1em;color:var(--accent-light);margin-top:0.3rem}
.year-spaced{letter-spacing:0.4em}

/* Venue */
.venue-label{font-family:var(--font-serif);font-weight:600;font-size:clamp(0.75rem,2vw,0.95rem);letter-spacing:0.25em;text-decoration:underline;text-underline-offset:4px;text-transform:uppercase;color:var(--accent)}
.venue-name{font-family:var(--font-serif);font-weight:600;font-size:clamp(0.9rem,2.5vw,1.2rem);letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.mobile{font-family:var(--font-serif);font-weight:400;font-size:clamp(0.7rem,1.8vw,0.85rem);color:var(--accent-light)}

/* Venue icon */
.venue-icon{width:40px;height:40px;color:var(--accent);opacity:0.7}

/* Footer */
.footer-row{display:flex;justify-content:space-between;width:100%;margin-top:1rem;gap:1rem}
.footer-col{flex:1;text-align:center}
.footer-label{font-family:var(--font-serif);font-weight:600;font-size:clamp(0.65rem,1.8vw,0.85rem);letter-spacing:0.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;color:var(--accent);margin-bottom:0.25rem}
.footer-value{font-family:var(--font-serif);font-weight:400;font-size:clamp(0.65rem,1.8vw,0.85rem);letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-light)}

/* Florals */
.floral{position:absolute;z-index:0;opacity:0;pointer-events:none}
.floral-top-right{top:-20px;right:-20px;width:280px;height:280px}
.floral-bottom-left{bottom:-10px;left:-10px;width:200px;height:200px}
.floral-bottom-right{bottom:-10px;right:-10px;width:200px;height:200px;transform:scaleX(-1)}

/* Animations */
.anim{opacity:0;transform:translateY(18px);transition:opacity var(--dur,700ms) var(--ease),transform var(--dur,700ms) var(--ease);transition-delay:var(--delay,0ms)}
.anim.fade-only{transform:none}
.anim.scale-up{transform:translateY(18px) scale(0.95)}
.anim.visible{opacity:1;transform:translateY(0) scale(1)}
.anim.fade-only.visible{opacity:1}
.floral.anim{transform:scale(0.92);--dur:1200ms}
.floral.anim.visible{opacity:var(--floral-opacity,0.3);transform:scale(1)}

/* Responsive */
@media(max-width:400px){
  .floral{transform:scale(0.7)!important}
  .floral.visible{transform:scale(0.75)!important}
  .event-section{padding:2rem 1.25rem}
  .date-left,.date-right{max-width:100px}
  .date-left{padding-right:0.8rem}
  .date-right{padding-left:0.8rem}
  .date-center{padding:0 0.8rem}
}
@media(min-width:769px){
  .event-section .content{max-width:640px}
  .floral-top-right{width:340px;height:340px}
  .floral-bottom-left,.floral-bottom-right{width:240px;height:240px}
}

/* ====== ADMIN PANEL ====== */
.admin-panel{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);background:#fff;padding:2rem}
.admin-card{max-width:420px;width:100%;text-align:center}
.admin-card h1{font-size:1.5rem;font-weight:600;letter-spacing:0.1em;color:#333;margin-bottom:0.4rem}
.admin-card p{font-size:0.85rem;color:#999;letter-spacing:0.05em;margin-bottom:2rem}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:0.9rem 0;border-bottom:1px solid #eee}
.toggle-row label{font-size:1rem;font-weight:400;letter-spacing:0.1em;color:#555;cursor:pointer}
.toggle-switch{position:relative;width:48px;height:26px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:#ddd;border-radius:13px;transition:background 0.3s}
.toggle-switch input:checked+.toggle-track{background:#B8960C}
.toggle-track::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform 0.3s}
.toggle-switch input:checked+.toggle-track::after{transform:translateX(22px)}
.admin-btn{margin-top:1.8rem;padding:0.75rem 2.5rem;font-family:var(--font-serif);font-size:0.9rem;letter-spacing:0.15em;text-transform:uppercase;background:#B8960C;color:#fff;border:none;border-radius:4px;cursor:pointer;transition:background 0.3s}
.admin-btn:hover{background:#9a7e0a}
.admin-msg{margin-top:1rem;font-size:0.85rem;color:#B8960C;min-height:1.4em}
.admin-msg.error{color:#c0392b}
.admin-link-box{margin-top:1rem;width:100%;padding:0.7rem;font-family:var(--font-serif);font-size:0.78rem;border:1px solid #ddd;border-radius:4px;color:#666;background:#fafafa;word-break:break-all;text-align:left;outline:none;resize:none;min-height:2.5rem}

/* ====== ENVELOPE SCREEN ====== */
#envelope-screen{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
#envelope-screen::before{
  content:'';position:absolute;inset:0;z-index:0;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;pointer-events:none;
}
.env-floral{position:absolute;pointer-events:none;z-index:0;color:#B5651D}
.env-floral-tr{top:-20px;right:-20px;width:min(340px,52vw);height:auto;opacity:0.30}
.env-floral-bl{bottom:-10px;left:-10px;width:min(220px,38vw);height:auto;opacity:0.30}

/* Envelope widget */
#envelope-widget{
  position:relative;z-index:10;
  width:clamp(280px,78vw,420px);
  perspective:1200px;
  transform-style:preserve-3d;
  opacity:0;transform:translateY(28px) scale(0.96);
}
#env-body{
  width:100%;padding-bottom:72%;position:relative;border-radius:3px;
  background:#FFF8F0;overflow:hidden;
  box-shadow:0 8px 40px rgba(139,69,19,0.18),0 2px 12px rgba(0,0,0,0.10),inset 0 0 0 1px rgba(181,101,29,0.15);
}
/* Horizontal crease at flap junction */
#env-body::after{
  content:'';position:absolute;top:52%;left:0;right:0;height:1px;
  background:rgba(181,101,29,0.18);z-index:5;pointer-events:none;
}
.env-fold-line{position:absolute;width:141.4%;height:1px;background:rgba(181,101,29,0.08);top:50%;left:50%;transform-origin:center}
.env-fold-line-1{transform:translate(-50%,-50%) rotate(33deg)}
.env-fold-line-2{transform:translate(-50%,-50%) rotate(-33deg)}
.env-bottom-fold{position:absolute;bottom:0;left:0;width:100%;height:55%;clip-path:polygon(0% 100%,50% 30%,100% 100%);background:#F5ECD8;border-top:1px solid rgba(181,101,29,0.12)}
.env-left-fold{position:absolute;left:0;top:0;width:50%;height:100%;clip-path:polygon(0% 0%,0% 100%,42% 50%);background:#F8F1E4}
.env-right-fold{position:absolute;right:0;top:0;width:50%;height:100%;clip-path:polygon(100% 0%,100% 100%,58% 50%);background:#F3EAD8}
#card-peek{
  position:absolute;bottom:10%;left:10%;width:80%;height:75%;
  background:linear-gradient(180deg,#FFFFFF 0%,#FDF8F3 100%);
  border-radius:2px;box-shadow:0 -2px 20px rgba(0,0,0,0.12);
  transform:translateY(100%);opacity:0;z-index:1;
}
#env-flap{
  position:absolute;top:0;left:0;width:100%;height:52%;z-index:20;
  transform-origin:top center;transform:rotateX(0deg);
  transition:transform 0.72s cubic-bezier(0.76,0,0.24,1);
  background:linear-gradient(175deg,#FFF6EC 0%,#F5E3C4 55%,#E8D0A0 100%);
  border-top:1px solid rgba(181,101,29,0.14);
  border-left:1px solid rgba(181,101,29,0.14);
  border-right:1px solid rgba(181,101,29,0.14);
  box-shadow:0 6px 20px rgba(139,69,19,0.14);
  transform-style:preserve-3d;
  backface-visibility:hidden;
  overflow:hidden;
}
/* V-fold crease drawn as SVG INSIDE flap — no clip-path on parent */
#env-flap .flap-v-svg{
  position:absolute;bottom:0;left:0;width:100%;height:100%;
  pointer-events:none;
}
#env-flap.open{box-shadow:none;}
/* Seal */
#env-seal{
  position:absolute;z-index:30;cursor:pointer;
  top:calc(52% - clamp(38px,11vw,58px));left:50%;transform:translateX(-50%);
}
.seal-outer-ring{
  width:clamp(70px,18vw,110px);height:clamp(70px,18vw,110px);
  border-radius:50%;border:1px solid rgba(181,101,29,0.35);padding:5px;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.seal-inner{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#D4956A 0%,#B5651D 30%,#8B4513 65%,#5C2D0E 100%);
  box-shadow:inset 0 -5px 15px rgba(0,0,0,0.35),inset 0 4px 10px rgba(255,210,160,0.22),0 5px 20px rgba(139,69,19,0.50),0 2px 6px rgba(0,0,0,0.25);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.seal-monogram{
  font-family:var(--font-script);font-size:clamp(1.4rem,4.5vw,2.2rem);
  color:rgba(255,245,228,0.88);text-shadow:0 1px 4px rgba(0,0,0,0.45);
  user-select:none;position:relative;z-index:2;
}
.seal-tick-ring{position:absolute;inset:-6px;pointer-events:none}
#seal-crack{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;z-index:3}
@keyframes seal-pulse-new{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.seal-pulsing-new{animation:seal-pulse-new 2.6s ease-in-out infinite}
@keyframes seal-pop{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.10)}100%{transform:translateX(-50%) scale(0.94)}}
/* Text below envelope */
.env-below-text{position:relative;z-index:10;margin-top:2rem;text-align:center;opacity:0;transform:translateY(14px)}
.env-invite-line{
  font-family:var(--font-serif);font-weight:300;font-style:italic;
  font-size:clamp(0.95rem,2.8vw,1.25rem);color:#B5651D;
}
.env-tap-line{
  font-family:var(--font-serif);font-weight:300;font-size:clamp(0.58rem,1.6vw,0.72rem);
  letter-spacing:0.38em;text-transform:uppercase;color:rgba(181,101,29,0.50);margin-top:0.5rem;
}
@keyframes tap-breathe-new{0%,100%{opacity:0.5}50%{opacity:0.2}}
.tap-breathing-new{animation:tap-breathe-new 2.4s ease-in-out infinite}
</style>
</head>

<script>
(function(){
  // ===== OG THUMBNAIL GENERATION =====
  function generateOGThumbnail(){
    try{
      var c=document.getElementById('og-canvas');
      if(!c)return;
      var ctx=c.getContext('2d');
      // Background
      ctx.fillStyle='#FDFAF7';
      ctx.fillRect(0,0,1200,630);
      // Subtle texture
      ctx.globalAlpha=0.018;
      for(var ty=0;ty<630;ty+=3){
        for(var tx=0;tx<1200;tx+=3){
          if(Math.random()>0.5){
            ctx.fillStyle=Math.random()>0.5?'#d0c8b8':'#e8e0d4';
            ctx.fillRect(tx,ty,2,2);
          }
        }
      }
      ctx.globalAlpha=1;

      // Top-right floral
      ctx.save();
      ctx.globalAlpha=0.32;
      ctx.strokeStyle='#B5651D';
      ctx.lineWidth=1.6;
      // Rose
      ctx.beginPath();ctx.arc(1080,80,30,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1080,50);ctx.bezierCurveTo(1070,65,1075,75,1080,80);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1080,50);ctx.bezierCurveTo(1090,65,1085,75,1080,80);ctx.stroke();
      // Peony
      ctx.beginPath();ctx.ellipse(1140,50,28,22,0,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1120,35);ctx.bezierCurveTo(1130,42,1135,30,1140,35);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1160,35);ctx.bezierCurveTo(1150,42,1145,30,1140,35);ctx.stroke();
      // Leaves
      ctx.beginPath();ctx.moveTo(1050,100);ctx.bezierCurveTo(1020,140,1000,170,980,200);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1030,130);ctx.bezierCurveTo(1015,120,1020,105,1030,110);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1150,75);ctx.bezierCurveTo(1170,100,1180,140,1185,180);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1165,110);ctx.bezierCurveTo(1180,100,1175,85,1165,95);ctx.stroke();
      // Stems
      ctx.beginPath();ctx.moveTo(1100,95);ctx.bezierCurveTo(1080,130,1060,170,1040,200);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1120,70);ctx.bezierCurveTo(1140,110,1155,150,1160,190);ctx.stroke();
      // Small buds
      ctx.beginPath();ctx.arc(980,200,8,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(1185,180,7,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(1040,200,5,0,Math.PI*2);ctx.stroke();
      // Rose 2
      ctx.beginPath();ctx.arc(1020,110,18,0,Math.PI*2);ctx.stroke();
      ctx.restore();

      // Bottom-left floral
      ctx.save();
      ctx.globalAlpha=0.32;
      ctx.strokeStyle='#B5651D';
      ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(100,430);ctx.bezierCurveTo(80,470,65,510,55,560);ctx.stroke();
      ctx.beginPath();ctx.moveTo(130,440);ctx.bezierCurveTo(120,480,115,520,110,570);ctx.stroke();
      ctx.beginPath();ctx.moveTo(70,460);ctx.bezierCurveTo(50,500,40,540,35,580);ctx.stroke();
      // Berries
      ctx.beginPath();ctx.arc(55,560,6,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(45,545,5,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(65,550,5.5,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(110,570,6,0,Math.PI*2);ctx.stroke();
      // Leaves
      ctx.beginPath();ctx.moveTo(80,480);ctx.bezierCurveTo(65,470,60,480,72,488);ctx.closePath();ctx.stroke();
      ctx.beginPath();ctx.moveTo(120,470);ctx.bezierCurveTo(135,460,140,470,128,478);ctx.closePath();ctx.stroke();
      ctx.restore();

      // Thin horizontal rules
      ctx.save();
      ctx.strokeStyle='rgba(181,101,29,0.2)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(80,170);ctx.lineTo(1120,170);ctx.stroke();
      ctx.beginPath();ctx.moveTo(80,460);ctx.lineTo(1120,460);ctx.stroke();
      ctx.restore();

      // Helper: draw spaced text centered
      function drawSpaced(text,x,y,spacing){
        var chars=text.split('');
        var totalW=0;
        chars.forEach(function(ch){totalW+=ctx.measureText(ch).width+spacing;});
        totalW-=spacing;
        var cx=x-totalW/2;
        chars.forEach(function(ch){
          ctx.fillText(ch,cx,y);
          cx+=ctx.measureText(ch).width+spacing;
        });
      }

      // Text
      ctx.textAlign='center';ctx.textBaseline='middle';

      // Host name
      ctx.fillStyle='#B5651D';
      ctx.font="600 28px 'Cormorant Garamond',serif";
      drawSpaced('MR. & MRS. WAHEED AHMED',600,110,3.5);

      // Invite line
      ctx.save();
      ctx.globalAlpha=0.75;
      ctx.font="300 15px 'Cormorant Garamond',serif";
      drawSpaced('CORDIALLY INVITE YOU TO THE WEDDING CELEBRATIONS OF',600,155,2.5);
      ctx.restore();

      // Groom name
      ctx.fillStyle='#B5651D';
      ctx.font="italic 58px 'Great Vibes',cursive";
      ctx.fillText('Engr. Moneeb Raza',600,255);

      // WITH
      ctx.save();
      ctx.globalAlpha=0.65;
      ctx.font="300 13px 'Cormorant Garamond',serif";
      drawSpaced('WITH',600,295,4);
      ctx.restore();

      // Bride name
      ctx.fillStyle='#B5651D';
      ctx.font="italic 58px 'Great Vibes',cursive";
      ctx.fillText('Dr. Zainab Ehsan',600,355);

      // Events line
      ctx.save();
      ctx.globalAlpha=0.8;
      ctx.fillStyle='#8B0000';
      ctx.font="400 17px 'Cormorant Garamond',serif";
      drawSpaced('MEHNDI  ·  BARAT  ·  WALIMA',600,418,2.8);
      ctx.restore();

      // Date
      ctx.fillStyle='#B5651D';
      ctx.font="300 20px 'Cormorant Garamond',serif";
      drawSpaced('16 · 17 · 18  APRIL  2026',600,500,3);

      // Venue
      ctx.save();
      ctx.globalAlpha=0.65;
      ctx.font="400 14px 'Cormorant Garamond',serif";
      drawSpaced('AL-MADINA MARQUEE, KARIANWALA',600,545,2);
      ctx.restore();

      // Set meta tags
      var dataUrl=c.toDataURL('image/png');
      var ogMeta=document.getElementById('og-image-meta');
      var twMeta=document.getElementById('twitter-image-meta');
      if(ogMeta)ogMeta.setAttribute('content',dataUrl);
      if(twMeta)twMeta.setAttribute('content',dataUrl);
      // Remove canvas
      c.parentNode.removeChild(c);
    }catch(e){
      // Fail silently
      try{var cc=document.getElementById('og-canvas');if(cc)cc.parentNode.removeChild(cc);}catch(x){}
    }
  }

  // ===== ENVELOPE SCREEN =====
  function buildSealTicks(){
    var svg='';
    for(var i=0;i<12;i++){
      var angle=(i*30)*Math.PI/180;
      var x1=50+Math.cos(angle)*42;var y1=50+Math.sin(angle)*42;
      var x2=50+Math.cos(angle)*47;var y2=50+Math.sin(angle)*47;
      svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(255,220,170,0.40)" stroke-width="0.8"/>';
    }
    [0,90,180,270].forEach(function(deg){
      var a=deg*Math.PI/180;var cx=50+Math.cos(a)*45;var cy=50+Math.sin(a)*45;
      svg+='<polygon points="'+(cx)+','+(cy-2)+' '+(cx+1.5)+','+(cy)+' '+(cx)+','+(cy+2)+' '+(cx-1.5)+','+(cy)+'" fill="rgba(255,220,170,0.40)"/>';
    });
    return svg;
  }

  function createEnvelopeScreen(onOpen){
    var env=document.createElement('div');
    env.id='envelope-screen';

    // Corner florals + envelope widget + text below
    env.innerHTML=
      '<svg class="env-floral env-floral-tr" viewBox="0 0 140 150"><use href="#floral-bouquet"/></svg>'
     +'<svg class="env-floral env-floral-bl" viewBox="0 0 120 120"><use href="#floral-botanical"/></svg>'
     +'<div id="envelope-widget">'
       +'<div id="env-body">'
         +'<div class="env-fold-line env-fold-line-1"></div>'
         +'<div class="env-fold-line env-fold-line-2"></div>'
         +'<div class="env-bottom-fold"></div>'
         +'<div class="env-left-fold"></div>'
         +'<div class="env-right-fold"></div>'
         +'<div id="card-peek"></div>'
       +'</div>'
       +'<div id="env-flap">'
         /* V-fold crease line — purely decorative, inside the rectangle, no clip-path */
         +'<svg class="flap-v-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'
           +'<path d="M0 100 L50 55 L100 100" fill="rgba(245,230,200,0.6)" stroke="rgba(181,101,29,0.22)" stroke-width="0.4"/>'

       +'</div>'
       +'<div id="env-seal">'
         +'<div class="seal-outer-ring">'
           +'<svg class="seal-tick-ring" viewBox="0 0 100 100">'
             +'<circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,220,170,0.40)" stroke-width="0.8"/>'
             +buildSealTicks()
           +'</svg>'
           +'<div class="seal-inner">'
             +'<div class="seal-monogram">W\u00B7A</div>'
             +'<svg id="seal-crack" viewBox="0 0 100 100">'
               +'<path d="M50 50 Q45 35 38 12" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
               +'<path d="M50 50 Q60 30 72 15" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
               +'<path d="M50 50 Q38 48 12 55" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
               +'<path d="M50 50 Q62 52 88 58" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
               +'<path d="M50 50 Q42 65 30 88" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
               +'<path d="M50 50 Q58 68 68 90" stroke="#2a0f00" stroke-width="1" fill="none" opacity="0.7"/>'
             +'</svg>'
           +'</div>'
         +'</div>'
       +'</div>'
     +'</div>'
     +'<div class="env-below-text" id="env-below">'
       +'<div class="env-invite-line">You have been cordially invited</div>'
       +'<div class="env-tap-line" id="env-tap">Tap the seal to open</div>'
     +'</div>';

    document.body.insertBefore(env,document.body.firstChild);

    var widget=document.getElementById('envelope-widget');
    var belowText=document.getElementById('env-below');
    var seal=document.getElementById('env-seal');
    var tapT=document.getElementById('env-tap');

    // Entry animation
    setTimeout(function(){
      widget.style.transition='opacity 900ms var(--ease),transform 900ms var(--ease)';
      widget.style.opacity='1';widget.style.transform='translateY(0) scale(1)';
    },350);
    setTimeout(function(){
      belowText.style.transition='opacity 700ms var(--ease),transform 700ms var(--ease)';
      belowText.style.opacity='1';belowText.style.transform='translateY(0)';
    },1000);
    // Start pulse + breathing after entry
    setTimeout(function(){
      seal.classList.add('seal-pulsing-new');
      tapT.classList.add('tap-breathing-new');
    },1600);

    // Click handler
    var tapped=false;
    seal.addEventListener('click',function openEnvelope(){
      if(tapped)return;
      tapped=true;
      seal.classList.remove('seal-pulsing-new');
      tapT.classList.remove('tap-breathing-new');

      // Step 1 (t=0): seal pop + crack
      seal.style.animation='seal-pop 160ms ease-out forwards';
      document.getElementById('seal-crack').style.opacity='1';

      // Step 2 (t=160): seal fade out
      setTimeout(function(){
        seal.style.transition='opacity 280ms ease-in,transform 280ms ease-in';
        seal.style.opacity='0';
        seal.style.transform='translateX(-50%) scale(0.80)';
      },160);

      // Step 3 (t=220): flap opens — rotateX on rectangle, no clip-path conflict
      setTimeout(function(){
        var flap=document.getElementById('env-flap');
        flap.classList.add('open');
        flap.style.transformOrigin='top center';
        flap.style.transform='rotateX(-178deg)';
      },220);

      // Remove overflow on body so card can peek (t=480)
      setTimeout(function(){
        document.getElementById('env-body').style.overflow='visible';
      },480);

      // Step 4 (t=500): card peeks out
      setTimeout(function(){
        var card=document.getElementById('card-peek');
        card.style.transition='transform 500ms var(--ease),opacity 500ms var(--ease)';
        card.style.transform='translateY(-22%)';
        card.style.opacity='1';
      },500);

      // Also fade out below text
      setTimeout(function(){
        belowText.style.transition='opacity 300ms ease-in';
        belowText.style.opacity='0';
      },400);

      // Step 5 (t=900): entire screen fades
      setTimeout(function(){
        env.style.transition='opacity 450ms ease-in,transform 450ms ease-in';
        env.style.opacity='0';
        env.style.transform='scale(1.03)';
      },900);

      // Step 6 (t=1000): app fades in
      setTimeout(function(){
        var appEl=document.getElementById('app');
        appEl.style.transition='opacity 400ms ease-out';
        appEl.style.opacity='1';
      },1000);

      // Step 7 (t=1350): cleanup + trigger animations
      setTimeout(function(){
        env.parentNode.removeChild(env);
        onOpen();
      },1350);
    });
  }

  // ===== MAIN INIT =====
  var params = new URLSearchParams(window.location.search);

  // ADMIN MODE
  if(params.has('admin')){
    document.getElementById('app').style.opacity='1';
    renderAdmin();
    // Generate OG thumbnail after fonts load
    document.fonts.ready.then(generateOGThumbnail).catch(function(){});
    return;
  }

  // INVITATION MODE
  var encoded = params.get('e');
  if(!encoded){ document.body.style.background='#fff'; return; }

  var decoded;
  try{ decoded = atob(encoded); }catch(e){ document.body.style.background='#fff'; return; }

  var validCodes = ['m','b','w','mb','mw','bw','mbw'];
  if(validCodes.indexOf(decoded) === -1){ document.body.style.background='#fff'; return; }

  // Clean URL
  history.replaceState(null,'',window.location.pathname);

  var showM = decoded.indexOf('m') !== -1;
  var showB = decoded.indexOf('b') !== -1;
  var showW = decoded.indexOf('w') !== -1;

  var events = [];
  if(showM) events.push({
    id:'mehndi',accent:'#8B0000',accentAlt:'#A0172A',
    host:'Mr. & Mrs. Waheed Ahmed',event:'Mehndi Ceremony',
    groom:'Engr. Moneeb Raza',bride:null,
    day:'Thursday',date:'16',month:'April',year:'2026',time:'07:00 PM',
    venueType:'Venue',venueName:'Al-Madina Marquee',city:'Karianwala',
    mobile:'0306-6290592',
    leftLabel:'Looking Forward',leftValue:'Waheed Garments Karianwala',
    rightLabel:'R.S.V.P',rightValue:'All Family Members'
  });
  if(showB) events.push({
    id:'barat',accent:'#B5651D',accentAlt:'#C1784A',
    host:'Mr. & Mrs. Waheed Ahmed',event:'Wedding Ceremony',
    groom:'Engr. Moneeb Raza',bride:'Dr. Zainab Ehsan',
    day:'Friday',date:'17',month:'April',year:'2026',time:'01:00 PM',
    venueType:'Residence',venueName:'Mohallah Shumali',city:'Karianwala',
    mobile:'0306-6290592',
    leftLabel:'Looking Forward',leftValue:'Waheed Garments Karianwala',
    rightLabel:'R.S.V.P',rightValue:'All Family Members'
  });
  if(showW) events.push({
    id:'walima',accent:'#B8960C',accentAlt:'#C9A84C',
    host:'Mr. & Mrs. Waheed Ahmed',event:'Walima Ceremony',
    groom:'Engr. Moneeb Raza',bride:'Dr. Zainab Ehsan',
    day:'Saturday',date:'18',month:'April',year:'2026',time:'06:00 PM',
    venueType:'Venue',venueName:'Al-Madina Marquee',city:'Karianwala',
    mobile:'0306-6290592',
    leftLabel:'Looking Forward',leftValue:'Waheed Garments Karianwala',
    rightLabel:'R.S.V.P',rightValue:'All Family Members'
  });

  var app = document.getElementById('app');
  events.forEach(function(ev,i){
    if(i > 0) app.insertAdjacentHTML('beforeend','<div class="section-divider" style="background:'+ev.accent+'"></div>');
    app.insertAdjacentHTML('beforeend', buildSection(ev));
  });

  // Generate OG thumbnail after fonts, then show envelope
  document.fonts.ready.then(function(){
    generateOGThumbnail();
    createEnvelopeScreen(function(){
      setupAnimations();
    });
  }).catch(function(){
    generateOGThumbnail();
    createEnvelopeScreen(function(){
      setupAnimations();
    });
  });

  function setupAnimations(){
    if(events.length === 1){
      setTimeout(function(){ animateSection(document.querySelector('.event-section')); },100);
    } else {
      var first = document.querySelector('.event-section');
      setTimeout(function(){ animateSection(first); },100);
      var obs = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting && !en.target.dataset.animated){
            en.target.dataset.animated='1';
            animateSection(en.target);
          }
        });
      },{threshold:0.2});
      document.querySelectorAll('.event-section').forEach(function(s,idx){
        if(idx > 0) obs.observe(s);
      });
    }
  }

  function animateSection(sec){
    var els = sec.querySelectorAll('.anim');
    els.forEach(function(el){
      var d = parseInt(el.dataset.delay||'0',10);
      setTimeout(function(){ el.classList.add('visible'); },d);
    });

  function buildSection(ev){

      +'<svg class="floral floral-bottom-right anim" data-delay="200" style="color:'+ev.accent+';--floral-opacity:0.25" viewBox="0 0 120 120"><use href="#floral-botanical"/></svg>'
      +'<div class="content">'
        +'<div class="host-name anim" data-delay="0" style="color:'+ev.accent+'">'+ev.host+'</div>'
        +'<div class="invite-line anim" data-delay="150" style="color:'+ev.accentAlt+'">Cordially Invite You At The</div>'
        +'<div class="invite-line anim" data-delay="200" style="color:'+ev.accentAlt+';margin-top:-1rem;font-weight:600;font-size:clamp(0.85rem,2.5vw,1.15rem)">'+ev.event+'</div>'
        +coupleHTML
        +'<div class="phrase anim fade-only" data-delay="500" style="color:'+ev.accentAlt+'">In Sha Allah</div>'
        +'<div class="date-block anim" data-delay="650">'
          +'<div class="date-left">'
            +'<div class="date-label underlined" style="color:'+ev.accent+'">'+ev.day+'</div>'
            +'<div class="date-value" style="color:'+ev.accentAlt+'">'+ev.time+'</div>'
          +'</div>'
          +'<div class="date-center" style="--accent:'+ev.accent+'">'
            +'<div class="date-number" style="color:'+ev.accent+'">'+ev.date+'</div>'
          +'</div>'
          +'<div class="date-right">'
            +'<div class="date-label underlined" style="color:'+ev.accent+'">'+ev.month+'</div>'
            +'<div class="date-value year-spaced" style="color:'+ev.accentAlt+'">2 0 2 6</div>'
          +'</div>'
        +'</div>'
        +'<div class="anim fade-only" data-delay="800" style="display:flex;flex-direction:column;align-items:center;gap:0.5rem">'
          +'<svg class="venue-icon" style="color:'+ev.accent+'" viewBox="0 0 40 40"><use href="#'+iconId+'"/></svg>'
          +'<div class="venue-label" style="color:'+ev.accent+'">'+ev.venueType+'</div>'
        +'</div>'
        +'<div class="anim" data-delay="900" style="display:flex;flex-direction:column;align-items:center;gap:0.3rem">'
          +'<div class="venue-name" style="color:'+ev.accent+'">'+ev.venueName+'</div>'
          +'<div class="venue-name" style="color:'+ev.accent+';font-size:clamp(0.8rem,2.2vw,1.05rem)">'+ev.city+'</div>'
          +'<div class="mobile" style="color:'+ev.accentAlt+'">'+ev.mobile+'</div>'
        +'</div>'
        +'<div class="footer-row anim" data-delay="1100">'
          +'<div class="footer-col">'
            +'<div class="footer-label" style="color:'+ev.accent+'">'+ev.leftLabel+'</div>'
            +'<div class="footer-value" style="color:'+ev.accentAlt+'">'+ev.leftValue+'</div>'
          +'</div>'
          +'<div class="footer-col">'
            +'<div class="footer-label" style="color:'+ev.accent+'">'+ev.rightLabel+'</div>'
            +'<div class="footer-value" style="color:'+ev.accentAlt+'">'+ev.rightValue+'</div>'
          +'</div>'
        +'</div>'
      +'</div>'
    +'</section>';
  }

  // ADMIN PANEL
  function renderAdmin(){
    document.getElementById('app').innerHTML =
      '<div class="admin-panel">'
      +'<div class="admin-card">'
        +'<h1>Invitation Link Generator</h1>'
        +'<p>Select events to include in the invitation</p>'
        +toggleRow('Mehndi','chk-m')
        +toggleRow('Barat','chk-b')
        +toggleRow('Walima','chk-w')
        +'<button class="admin-btn" id="gen-btn">Generate Link</button>'
        +'<div class="admin-msg" id="admin-msg"></div>'
        +'<textarea class="admin-link-box" id="admin-link" readonly style="display:none"></textarea>'
      +'</div>'
      +'</div>';

    document.getElementById('gen-btn').addEventListener('click',function(){
      var m=document.getElementById('chk-m').checked;
      var b=document.getElementById('chk-b').checked;
      var w=document.getElementById('chk-w').checked;
      var msg=document.getElementById('admin-msg');
      var box=document.getElementById('admin-link');
      if(!m&&!b&&!w){msg.textContent='Please select at least one event';msg.className='admin-msg error';box.style.display='none';return;}
      var code='';
      if(m)code+='m';if(b)code+='b';if(w)code+='w';
      var encoded=btoa(code);
      var base=window.location.origin+window.location.pathname.replace(/\?.*$/,'');
      var url=base+'?e='+encoded;
      box.value=url;box.style.display='block';
      navigator.clipboard.writeText(url).then(function(){
        msg.textContent='Link copied to clipboard ✓';msg.className='admin-msg';
      }).catch(function(){
        msg.textContent='Link generated — copy manually below';msg.className='admin-msg';
      });
    });
  }

  function toggleRow(label,id){
    return '<div class="toggle-row">'
      +'<label for="'+id+'">'+label+'</label>'
      +'<label class="toggle-switch"><input type="checkbox" id="'+id+'"><span class="toggle-track"></span></label>'
      +'</div>';
  }
})();
</script>
</body>
</html>
